<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funding overview — KU Lighthouse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/open-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="data/programmes.json" as="fetch" crossorigin="anonymous" />
  <link rel="modulepreload" href="results.js" />
  <link rel="modulepreload" href="shared.js" />
  <link rel="modulepreload" href="multiselect.js" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-results">
  <div class="brandbar">
    <div class="shell">
      <img src="assets/ku-logo.png" alt="University of Copenhagen" loading="lazy" decoding="async" />
    </div>
  </div>

  <header class="results-head">
    <div class="shell">
      <a class="back" href="index.html">← Back to search</a>
      <h1>Funding overview</h1>
    </div>
  </header>

  <main class="shell results-main">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search name, criteria, keywords…" autocomplete="off" />
      <div class="toolbar-filters-mobile" aria-label="Filter results">
        <div class="mobile-filter-field">
          <span class="mobile-filter-label">Opportunity</span>
          <div class="col-filter" id="col-filter-opportunity-mobile"></div>
        </div>
        <div class="mobile-filter-field">
          <span class="mobile-filter-label">Stage</span>
          <div class="col-filter" id="col-filter-stage-mobile"></div>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Company status">
        <button type="button" data-cvr="all" aria-pressed="true">All</button>
        <button type="button" data-cvr="no-company" aria-pressed="false">No company yet</button>
        <button type="button" data-cvr="have-cvr" aria-pressed="false">I have a CVR</button>
      </div>
      <div class="toolbar-end">
        <button type="button" id="sort-reset" class="sort-reset" hidden>Reset to default sort</button>
        <p class="result-count" id="result-count" aria-live="polite">Loading…</p>
      </div>
    </div>

    <div class="table-wrap">
      <table id="results-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="Name">Name <span class="arrow">↕</span></th>
            <th class="th-filterable sortable" data-sort="Opportunity">
              <div class="th-head">
                <span class="th-title">Opportunity <span class="arrow">↕</span></span>
                <div class="col-filter" id="col-filter-opportunity"></div>
              </div>
            </th>
            <th class="sortable" data-sort="Industrial segment">Industry segment <span class="arrow">↕</span></th>
            <th>Criteria</th>
            <th class="th-filterable sortable" data-sort="Stage">
              <div class="th-head">
                <span class="th-title">Stage <span class="arrow">↕</span></span>
                <div class="col-filter" id="col-filter-stage"></div>
              </div>
            </th>
            <th>Info</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr class="skeleton-row" aria-hidden="true"><td colspan="6"><div class="skeleton-block skeleton-block-title"></div><div class="skeleton-block skeleton-block-line"></div><div class="skeleton-block skeleton-block-line short"></div></td></tr>
          <tr class="skeleton-row" aria-hidden="true"><td colspan="6"><div class="skeleton-block skeleton-block-title"></div><div class="skeleton-block skeleton-block-line"></div><div class="skeleton-block skeleton-block-line short"></div></td></tr>
          <tr class="skeleton-row" aria-hidden="true"><td colspan="6"><div class="skeleton-block skeleton-block-title"></div><div class="skeleton-block skeleton-block-line"></div><div class="skeleton-block skeleton-block-line short"></div></td></tr>
          <tr class="skeleton-row" aria-hidden="true"><td colspan="6"><div class="skeleton-block skeleton-block-title"></div><div class="skeleton-block skeleton-block-line"></div><div class="skeleton-block skeleton-block-line short"></div></td></tr>
          <tr class="skeleton-row" aria-hidden="true"><td colspan="6"><div class="skeleton-block skeleton-block-title"></div><div class="skeleton-block skeleton-block-line"></div><div class="skeleton-block skeleton-block-line short"></div></td></tr>
          <tr class="skeleton-row" aria-hidden="true"><td colspan="6"><div class="skeleton-block skeleton-block-title"></div><div class="skeleton-block skeleton-block-line"></div><div class="skeleton-block skeleton-block-line short"></div></td></tr>
        </tbody>
      </table>
      <p id="empty" class="empty hidden">
        No matches. <a href="index.html">Try a new search</a>.
      </p>
    </div>
    <div class="load-more-wrap hidden" id="load-more-wrap">
      <button type="button" id="load-more" class="load-more">Show 25 more</button>
    </div>
  </main>

  <footer class="shell site-footer">
    <p>
      AI-assisted data — may contain errors or be out of date. Verify with the
      funding provider before applying. Feedback:
      <a href="mailto:kly@adm.ku.dk">kly@adm.ku.dk</a>.
    </p>
  </footer>

  <script src="results.js" type="module"></script>
</body>
</html>
